version: "3.7"

services:
  app_proxy:
    image: ghcr.io/willitmod/fracattack-app:0.3.1-dev # Toegevoegd om de proxy te laten werken
    restart: unless-stopped
    ports:
      - "8096:3000" # Dit wordt de poort op je ZimaOS (http://je-zimaos-ip:8096)
    environment:
      APP_HOST: app
      APP_PORT: 3000
      JWT_SECRET: "MijnFractalGeheim12345" # Pas dit aan naar een willekeurige code
    networks:
      - fracattack_net
    depends_on:
      - app

  init:
    image: alpine:3.22.1
    networks:
      - fracattack_net
    volumes:
      - /DATA/AppData/fracattack/data:/data
      - /DATA/AppData/fracattack:/appdata
    environment:
      NETWORK_IP: "127.0.0.1"
      RPC_USER: "fractal"
      RPC_PASSWORD: "AxeFbNodePass2026" # <--- KIES HIER JE RPC WACHTWOORD
      BTC_P2P_PORT: "28343"
      BTC_RPC_PORT: "28342"
      BTC_ZMQ_HASHBLOCK_PORT: "28345"
      PAYOUT_ADDRESS: "bc1qg09gugv3kk2sv8svq7zewmt6ey00gppkctgtzk" # <--- PAS DIT AAN NAAR JOUW FRACTAL ADRES!
    command:
      - /bin/sh
      - -ec
      - |-
        set -eu
        apk add --no-cache bind-tools envsubst jq >/dev/null

        mkdir -p /data/node /data/pool/config /data/pool/www/pool /data/pool/www/users /data/templates

        # Basis templates genereren als ze niet bestaan zodat de app niet crasht
        if [ ! -f /data/templates/bitcoin.conf.template ]; then
          echo -e "rpcuser=\$RPC_USER\nrpcpassword=\$RPC_PASSWORD\nrpcport=\$BTC_RPC_PORT\nport=\$BTC_P2P_PORT\nzmqpubhashblock=tcp://0.0.0.0:\$BTC_ZMQ_HASHBLOCK_PORT\nserver=1\ntxindex=1\n[main]\nrpcbind=0.0.0.0\nrpcallowip=0.0.0.0/0" > /data/templates/bitcoin.conf.template
        fi
        if [ ! -f /data/templates/ckpool.conf.template ]; then
          echo -e '{\n"btclg": true,\n"btcaddress": "${PAYOUT_ADDRESS}",\n"btcnode": "fractald:${BTC_RPC_PORT}",\n"btcuser": "${RPC_USER}",\n"btcpass": "${RPC_PASSWORD}",\n"webdir": "/data/pool/www/pool",\n"userdir": "/data/pool/www/users"\n}' > /data/templates/ckpool.conf.template
        fi

        if [ ! -f /data/node/bitcoin.conf ]; then
          envsubst < /data/templates/bitcoin.conf.template > /data/node/bitcoin.conf
        fi

        if [ ! -f /data/pool/config/ckpool.conf ]; then
          envsubst < /data/templates/ckpool.conf.template > /data/pool/config/ckpool.conf
        fi
        chown -R 1000:1000 /data /appdata || true

  fractald:
    image: ghcr.io/willitmod/fracattack-fractald:0.3.1-dev
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 15m30s
    networks:
      - fracattack_net
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - /DATA/AppData/fracattack/data/node:/data
    ports:
      - "28343:28343/tcp"
    # Entrypoint hersteld naar de standaard node-start voor deze specifieke image
    command: ["-datadir=/data", "-conf=/data/bitcoin.conf"] 

  ckpool:
    image: ghcr.io/willitmod/fracattack-ckpool:0.3.1-dev
    user: "1000:1000"
    restart: unless-stopped
    networks:
      - fracattack_net
    depends_on:
      init:
        condition: service_completed_successfully
      fractald:
        condition: service_started
    ports:
      - "9333:3333/tcp" # Stratum poort voor je miners (ASICs/Software)
    volumes:
      - /DATA/AppData/fracattack/data/pool:/data/pool
    command: ["-c", "/data/pool/config/ckpool.conf"]

  app:
    image: ghcr.io/willitmod/fracattack-app:0.3.1-dev
    user: "1000:1000"
    restart: unless-stopped
    networks:
      - fracattack_net
    depends_on:
      init:
        condition: service_completed_successfully
      fractald:
        condition: service_started
    volumes:
      - /DATA/AppData/fracattack/data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      APP_COMPOSE_PROJECT: "fracattack"
      BCH2_RPC_HOST: "fractald"
      BCH2_RPC_PORT: "28342"
      BCH2_RPC_USER: "fractal"
      BCH2_RPC_PASS: "AxeFbNodePass2026" # <--- MOET GELIJK ZIJN AAN RPC_PASSWORD IN INIT

networks:
  fracattack_net:
    driver: bridge

x-casaos:
  author: WVK2017
  category: Crypto
  icon: https://fractalbitcoin.io
  port_map: "8096"
  scheme: http
  title:
    en_US: FracAttack Fractal Node
