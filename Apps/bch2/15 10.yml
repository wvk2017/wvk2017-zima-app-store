version: "3.7"

services:
  init_permissions:
    image: alpine:3.22.1
    restart: "no"
    networks:
      - frackatack 
    volumes:
      - /DATA/AppData/frackatack/data:/data
    command:
      - /bin/sh
      - -ec
      - |-
        set -eu
        mkdir -p /data/ui/state /data/node /data/pool/config /data/pool/www/pool /data/pool/www/users
        chown -R 1000:1000 /data/ui /data/node /data/pool || true
        chmod -R ug+rwX /data/ui /data/node /data/pool || true

  app:
    image: ghcr.io/willitmod/frackatack-app:
    user: "1000:1000"
    restart: unless-stopped
    networks:
      - frackatack
    ports:
      - ""
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      fractal:
        condition: service_started
    volumes:
      - /DATA/AppData/frackatack/data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      APP_ID: "willitmod-dev-frackatack"
      APP_VERSION: ""
      APP_CHANNEL: ""
      APP_RELEASE_PHASE: ""
      APP_SELF_RESTART_ENABLED: "1"
      APP_COMPOSE_PROJECT: "frackatack"
      NETWORK_IP: "127.0.0.1" 
      FB_NODE_IMAGE: "ghcr.io/willitmod/frackatack-node:"
      CKPOOL_IMAGE: "ghcr.io/willitmod/frackatack-ckpool:"
      fb_RPC_HOST: "fractal"
      FB_RPC_PORT: ""
      FB_RPC_USER: "feactal"
      FB_RPC_PASS:  # <--- VERANDER DIT IN JOUW EIGEN WACHTWOORD
      CKPOOL_STRATUM_HOST: "ckpool"
      CKPOOL_STRATUM_PORT: "3333"
      JWT_SECRET:  # <--- VERANDER DIT IN EEN WILLEKEURIGE REEKS
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import sys, urllib.request; r=urllib.request.urlopen('http://127.0.0.1:3000/api/about', timeout=3); sys.exit(0 if r.status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  bch2:
    image: ghcr.io/willitmod/frackatack-node:
    restart: unless-stopped
    stop_grace_period: 15m30s
    networks:
      - frackatack
    depends_on:
      init_permissions:
        condition: service_completed_successfully
    environment:
      NETWORK: "mainnet"
      RPC_USER: "fractal"
      RPC_PASSWORD:  # <--- MOET EXACT GELIJK ZIJN AAN BCH2_RPC_PASS
      RPC_PORT: ""
      P2P_PORT: ""
      ZMQ_HASHBLOCK: "tcp://0.0.0.0:
      EXTERNAL_IP: "127.0.0.1"
      FORCE_IPV4_BIND: "1"
      PRUNE: "0"
      RPC_THREADS: "4"
      MAX_MEMPOOL: "64"
      DB_CACHE: "256"
      TX_INDEX: "0"
      BOOTSTRAP_CONNECTNODES: ""
      PEER_WATCHDOG_INTERVAL: "30"
      PEER_WATCHDOG_MIN_CONNECTIONS: "1"
      ONE_TIME_FULL_RESYNC_KEY: ""
      ONE_TIME_FULL_RESYNC_REQUIRE_EXISTING_DATA: "1"
      ONE_TIME_REINDEX_KEY: ""
      ONE_TIME_REINDEX_REQUIRE_EXISTING_DATA: "1"
    volumes:
      - /DATA/AppData/frackatack/data/node:/data/node
    ports:
      - ":/tcp"
    healthcheck:
      test:
        - CMD-SHELL
        - cli -datadir=/data/node -rpcuser="" -rpcpassword="" getblockchaininfo >/dev/null 2>&1
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 2m

  ckpool:
    image: ghcr.io/willitmod/frackatack-ckpool:
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - frackatack
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      bch2:
        condition: service_started
    environment:
      FB_RPC_HOST: "fractal"
      FB_RPC_PORT: ""
      FB_RPC_USER: "fractal"
      FB_RPC_PASSWORD:  # <--- MOET EXACT GELIJK ZIJN AAN DE REST
      FB_ZMQ_HASHBLOCK_PORT: ""
      PAYOUT_ADDRESS: "CHANGEME_FB_PAYOUT_ADDRESS" 
      MINDIFF: "1"
      STARTDIFF: "16"
      MAXDIFF: "0"
    user: "1000:1000"
    command: ["-k", "-L", "-c", "/data/pool/config/ckpool.conf"]
    ports:
      - ":/tcp"
    volumes:
      - /DATA/AppData/frackatack/data/pool:/data/pool
    healthcheck:
      test:
        - CMD-SHELL
        - 'pid=$$(cat /tmp/ckpool/main.pid 2>/dev/null || true); [ -n "$$pid" ] && kill -0 "$$pid" 2>/dev/null'
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s

networks:
  frackatack:
    driver: bridge

x-casaos:
  author: WVK2017
  category: Crypto
  icon: https://githubusercontent.com
  index: /
  port_map: "8096"
  scheme: http
  title:
    en_US: frackatack Dev
