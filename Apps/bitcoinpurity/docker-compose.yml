name: wvk2017-Bitcoin-Purity
services:
  app:
    container_name: btc1
    image: wvk2017/nodes:btc1
    restart: always
    volumes:
      - /media/ZimaOS-HD/NodeData/btc1:/root/.bitcoin
    ports:
      - "7033:7033"
      - "9033:9033"
      - "8340:8340"
    command: "/usr/bin/bitcoind -printtoconsole -server -txindex=0 -prune=550 -disablewallet=1 -zmqpubhashblock=tcp://127.0.0.1:7033 -rpcbind=0.0.0.0 -rpcport=9033 -rpcallowip=0.0.0.0/0 -port=8340 -rpcuser=pooluser -rpcpassword=poolpassword"
    x-casaos:
      volumes:
        - container: /root/.bitcoin
          description:
            en_us: 'Container Path: /root/.bitcoin'
      ports:
        - container: "7033"
          description:
            en_us: 'Container Port: 7033'
        - container: "9033"
          description:
            en_us: 'Container Port: 9033'
        - container: "8340"
          description:
            en_us: 'Container Port: 8340'
x-casaos:
  architectures:
    - amd64
  main: app
  description:
    en_us: Bitcoin-Purity Cryptocurrency Node. Can be used in conjunction with Miningcore Apps to solo mine.
  tagline:
    en_us: Bitcoin-Purity Cryptocurrency Node.
  developer: wvk2017
  author: wvk2017
  icon: https://btc1.molepool.com/assets/coin-hBAokysi.png
  thumbnail: ""
  title:
    en_us: Bitcoin-Purity (BTC1) Node
  category: WVK2017
  port_map: "8888"
