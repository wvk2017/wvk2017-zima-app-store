services:
  app:
    command:
      - /usr/bin/bitcoind -printtoconsole -datadir=/data -server -prune=550
        -wallet=default -zmqpubhashblock=tcp://127.0.0.1:7033 -rpcbind=0.0.0.0
        -rpcport=9033 -rpcallowip=0.0.0.0/0 -rpcuser=pooluser
        -rpcpassword=poolpassword
    container_name: bitcoinpurity
    image: wvk2017/nodes:btc1
    network_mode: bridge
    ports:
      - 7033:7033
      - 9033:9033
    restart: always
    volumes:
      - /media/ZimaOS-HD/NodeData/bitcoinpurity:/root/.bitcoinpurity
x-casaos:
  architectures:
    - amd64
  author: wvk2017
  category: WVK2017
  description:
    en_us: bitcoinpurity (btc1) Cryptocurrency Node. Can be used in conjunction with
      Miningcore Apps to solo mine.
  developer: wvk2017
  hostname: ""
  icon: https://btc1.molepool.com/assets/coin-hBAokysi.png
  index: /
  main: app
  port_map: "8888"
  scheme: http
  tagline:
    en_us: bitcoinpurity (btc1) Cryptocurrency Node.
  thumbnail: ""
  title:
    custom: bitcoinpurity (btc1) Node
    en_us: bitcoinpurity (btc1) Node
