name: wvk2017-bitcoinpurity
services:
  app:
    container_name: btc1
    image: wvk2017/nodes:btc1
    restart: always
    volumes:
      - /media/ZimaOS-HD/btc1:/root/.bitcoin
    ports:
      - "7033:7033"
      - "9033:9033"
    command: "/usr/bin/bitcoind -printtoconsole -server -prune=550 -wallet=default -zmqpubhashblock=tcp://127.0.0.1:7033 -rpcbind=0.0.0.0 -rpcport=9033 -rpcallowip=0.0.0.0/0 -rpcuser=pooluser -rpcpassword=poolpassword"
x-casaos:
  architectures:
    - amd64
  main: app
  description:
    en_us: Bitcoin-Purity (btc1) Cryptocurrency Node. Can be used in conjunction with Miningcore Apps to solo mine.
  tagline:
    en_us: Bitcoin-Purity (btc1) Cryptocurrency Node.
  developer: wvk2017
  author: wvk2017
  icon: https://btc1.molepool.com/assets/coin-hBAokysi.png
  thumbnail: ""
  title:
    en_us: Bitcoin-Purity (btc1) Cryptocurrency Node
  category: wvk2017
  port_map: "8888"
