version: "3.7"

services:
  init_permissions:
    image: alpine:3.22.1
    restart: "no"
    networks:
      - frackatack_net
    volumes:
      - /DATA/AppData/frackatack/data:/data
    command:
      - /bin/sh
      - -ec
      - |-
        set -eu
        mkdir -p /data/ui/state /data/node /data/pool/config /data/pool/www/pool /data/pool/www/users
        chown -R 1000:1000 /data/ui /data/node /data/pool || true
        chmod -R ug+rwX /data/ui /data/node /data/pool || true

  app:
    image: ghcr.io/willitmod/fracattack-app-umbrel-dev:0.1.4
    user: "1000:1000"
    restart: unless-stopped
    networks:
      - frackatack_net
    ports:
      - "21225:3000"
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      fractal:
        condition: service_started
    volumes:
      - /DATA/AppData/frackatack/data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      APP_ID: "willitmod-dev-frackatack"
      APP_VERSION: "0.1.3"
      APP_CHANNEL: "RC1"
      APP_RELEASE_PHASE: "ALPHA"
      APP_SELF_RESTART_ENABLED: "1"
      APP_COMPOSE_PROJECT: "frackatack"
      NETWORK_IP: "127.0.0.1" 
      BTC_NODE_IMAGE: "ghcr.io/willitmod/fracattack-fractald:0.3.1"
      BTC_CKPOOL_IMAGE: "ghcr.io/willitmod/docker-ckpool-solo:590fb2a"
      BTC_RPC_HOST: "fractal"
      BTC_RPC_PORT: "28342"
      BTC_RPC_USER: "fractal"
      BTC_RPC_PASS: MijnSuperVeiligWachtwoord123
      CKPOOL_STRATUM_HOST: "ckpool"
      CKPOOL_STRATUM_PORT: "3333"
      JWT_SECRET: sajkdh9a23hf8923hfshdf23
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import sys, urllib.request; r=urllib.request.urlopen('http://127.0.0.1:3000/api/about', timeout=3); sys.exit(0 if r.status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  fractal:
    image: ghcr.io/willitmod/fracattack-fractald:0.3.1
    restart: unless-stopped
    stop_grace_period: 15m30s
    networks:
      - frackatack_net
    depends_on:
      init_permissions:
        condition: service_completed_successfully
    environment:
      NETWORK: "mainnet"
      RPC_USER: "fractal"
      RPC_PASSWORD: MijnSuperVeiligWachtwoord123
      RPC_PORT: "28342"
      P2P_PORT: "28343"
      ZMQ_HASHBLOCK: "tcp://0.0.0.0:28345"
      EXTERNAL_IP: "127.0.0.1"
      FORCE_IPV4_BIND: "1"
      PRUNE: "0"
      RPC_THREADS: "4"
      MAX_MEMPOOL: "64"
      DB_CACHE: "256"
      TX_INDEX: "1"
    volumes:
      - /DATA/AppData/frackatack/data/node:/data/node
    ports:
      - "28343:28343/tcp"
    healthcheck:
      test:
        - CMD-SHELL
        - bitcoin-cli -datadir=/data/node -rpcuser="fractal" -rpcpassword="MijnSuperVeiligWachtwoord123" -rpcport=28342 getblockchaininfo >/dev/null 2>&1
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 2m

  ckpool:
    image: ghcr.io/willitmod/docker-ckpool-solo:590fb2a
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - frackatack_net
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      fractal:
        condition: service_started
    environment:
      BTC_RPC_HOST: "fractal"
      BTC_RPC_PORT: "28342"
      BTC_RPC_USER: "fractal"
      BTC_RPC_PASSWORD: MijnSuperVeiligWachtwoord123
      BTC_ZMQ_HASHBLOCK_PORT: "28345"
      PAYOUT_ADDRESS: "bc1qg09gugv3kk2sv8svq7zewmt6ey00gppkctgtzk" 
      MINDIFF: "1"
      STARTDIFF: "16"
      MAXDIFF: "0"
    user: "1000:1000"
    command: ["-k", "-L", "-c", "/data/pool/config/ckpool.conf"]
    ports:
      - "7891:3333/tcp"
    volumes:
      - /DATA/AppData/frackatack/data/pool:/data/pool
    healthcheck:
      test:
        - CMD-SHELL
        - 'pid=$$(cat /tmp/ckpool/main.pid 2>/dev/null || true); [ -n "$$pid" ] && kill -0 "$$pid" 2>/dev/null'
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s

networks:
  frackatack_net:
    driver: bridge

x-casaos:
  author: WVK2017
  category: Crypto
  icon: https://githubusercontent.com
  index: /
  port_map: "21225"
  scheme: http
  store_app_id: compose-19afac31fd0ecfeb
  title:
    custom: Frackatack Solo Pool
