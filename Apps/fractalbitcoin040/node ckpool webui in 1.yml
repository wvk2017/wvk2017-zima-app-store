networks:
  frackatack_net:
    name: compose-custom_frackatack_net
    driver: bridge
    ipam: {}
    external: false
services:
  app:
    command: null
    container_name: Frackatack_app
    deploy:
      resources:
        limits:
          memory: 4GB
          cpus: "1.00"
        reservations:
          memory: 256MB
          cpus: "0.00"
      placement: {}
    entrypoint: null
    environment:
      APP_CHANNEL: ZIMAOS
      APP_COMPOSE_PROJECT: frackatack
      APP_ID: willitmod-dev-fracattack
      APP_RELEASE_PHASE: ZIMAOS
      APP_VERSION: 0.4.0
      BTC_CKPOOL_IMAGE: ghcr.io/willitmod/docker-ckpool-solo:590fb2a
      BTC_NODE_IMAGE: ghcr.io/willitmod/fracattack-fractald:0.4.0
      BTC_RPC_HOST: Frackatack_node
      BTC_RPC_PASS: poolpassword
      BTC_RPC_PORT: "28342"
      BTC_RPC_USER: fractal
      CKPOOL_STRATUM_HOST: Frackatack_ckpool
      CKPOOL_STRATUM_PORT: "7891"
      JWT_SECRET: sajkdh9a23hf8923hfshdf23
      NETWORK_IP: 127.0.0.1
    image: ghcr.io/willitmod/fracattack-app-umbrel-dev:0.1.4
    labels:
      icon: https://raw.githubusercontent.com/WillItMod/5tratStore-dev/refs/heads/main/willitmod-dev-fracattack/icon.png
    networks:
      - frackatack_net
    ports:
      - mode: ingress
        target: 3000
        published: "21225"
        protocol: tcp
    restart: unless-stopped
    user: 0:0
    volumes:
      - type: bind
        source: /media/ZimaOS-HD/NodeData/frackatack
        target: /data
        bind:
          create_host_path: true
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: true
  ckpool:
    command:
      - -k
      - -L
      - -c
      - /data/pool/config/ckpool.conf
    container_name: Frackatack_ckpool
    deploy:
      resources:
        limits:
          memory: 4GB
          cpus: "1.00"
        reservations:
          memory: 256MB
          cpus: "0.00"
      placement: {}
    entrypoint: null
    environment:
      BTC_RPC_HOST: Frackatack_node
      BTC_RPC_PASSWORD: poolpassword
      BTC_RPC_PORT: "28342"
      BTC_RPC_USER: fractal
      BTC_ZMQ_HASHBLOCK_PORT: "28345"
      MAXDIFF: "0"
      MINDIFF: "1"
      PAYOUT_ADDRESS: bc1qp05vuzc5x4ym3cujh666xm6mzh0q6yqmkmtndl
      STARTDIFF: "16"
    image: ghcr.io/willitmod/docker-ckpool-solo:590fb2a
    labels:
      icon: https://raw.githubusercontent.com/WillItMod/5tratStore-dev/refs/heads/main/willitmod-dev-fracattack/icon.png
    networks:
      - frackatack_net
    ports:
      - mode: ingress
        target: 3333
        published: "7891"
        protocol: tcp
    restart: unless-stopped
    user: 0:0
    volumes:
      - type: bind
        source: /media/ZimaOS-HD/NodeData/frackatack
        target: /data
        bind:
          create_host_path: true
  init:
    command:
      - /bin/sh
      - -ec
      - >-
        set -eu

        mkdir -p /data/node /data/pool/config /data/pool/www/pool
        /data/pool/www/users

        echo 'server=1' > /data/node/bitcoin.conf

        echo 'listen=1' >> /data/node/bitcoin.conf

        echo 'discover=1' >> /data/node/bitcoin.conf

        echo 'rpcuser=fractal' >> /data/node/bitcoin.conf

        echo 'rpcpassword=poolpassword' >> /data/node/bitcoin.conf

        echo 'rpcport=28342' >> /data/node/bitcoin.conf

        echo 'port=28343' >> /data/node/bitcoin.conf

        echo 'rpcbind=0.0.0.0' >> /data/node/bitcoin.conf

        echo 'rpcallowip=0.0.0.0/0' >> /data/node/bitcoin.conf

        echo 'prune=10000' >> /data/node/bitcoin.conf

        echo 'zmqpubhashblock=tcp://0.0.0.0:28345' >> /data/node/bitcoin.conf

        echo 'txindex=0' >> /data/node/bitcoin.conf

        echo 'addnode=x9.dnsseed-mainnet.fractalbitcoin.io' >>
        /data/node/bitcoin.conf

        echo 'addnode=x9.dnsseed-mainnet.unisat.io' >> /data/node/bitcoin.conf


        echo '{' > /data/pool/config/ckpool.conf

        echo '  "btchost": "Frackatack_node",' >> /data/pool/config/ckpool.conf

        echo '  "btcport": 28342,' >> /data/pool/config/ckpool.conf

        echo '  "btcuser": "fractal",' >> /data/pool/config/ckpool.conf

        echo '  "btcpass": "poolpassword",' >> /data/pool/config/ckpool.conf

        echo '  "btcaddress": "bc1qp05vuzc5x4ym3cujh666xm6mzh0q6yqmkmtndl",' >>
        /data/pool/config/ckpool.conf

        echo '  "bindaddress": "0.0.0.0",' >> /data/pool/config/ckpool.conf

        echo '  "stratumport": 3333,' >> /data/pool/config/ckpool.conf

        echo '  "zmqblock": "tcp://Frackatack_node:28345",' >>
        /data/pool/config/ckpool.conf

        echo '  "webdir": "/data/pool/www/pool",' >>
        /data/pool/config/ckpool.conf

        echo '  "userdir": "/data/pool/www/users"' >>
        /data/pool/config/ckpool.conf

        echo '}' >> /data/pool/config/ckpool.conf


        if [ ! -f /data/pool/config/ckpool.args ]; then
          echo "-B" > /data/pool/config/ckpool.args
        fi
    container_name: Frackatack_init
    deploy:
      resources:
        limits:
          memory: 4GB
          cpus: "1.00"
        reservations:
          memory: 256MB
          cpus: "0.00"
      placement: {}
    entrypoint: null
    image: alpine:3.22.1
    labels:
      icon: https://raw.githubusercontent.com/WillItMod/5tratStore-dev/refs/heads/main/willitmod-dev-fracattack/icon.png
    networks:
      - frackatack_net
    restart: no
    volumes:
      - type: bind
        source: /media/ZimaOS-HD/NodeData/frackatack
        target: /data
        bind:
          create_host_path: true
  node:
    command: null
    container_name: Frackatack_node
    depends_on:
      init:
        condition: service_completed_successfully
        required: true
    deploy:
      resources:
        limits:
          memory: 8GB
          cpus: "2.00"
        reservations:
          memory: 256MB
          cpus: "0.00"
      placement: {}
    entrypoint: null
    image: ghcr.io/willitmod/fracattack-fractald:0.4.0
    labels:
      icon: https://raw.githubusercontent.com/WillItMod/5tratStore-dev/refs/heads/main/willitmod-dev-fracattack/icon.png
    networks:
      - frackatack_net
    ports:
      - mode: ingress
        target: 28342
        published: "28342"
        protocol: tcp
      - mode: ingress
        target: 28343
        published: "28343"
        protocol: tcp
      - mode: ingress
        target: 28345
        published: "28345"
        protocol: tcp
    restart: unless-stopped
    stop_grace_period: 15m30s
    user: 0:0
    volumes:
      - type: bind
        source: /media/ZimaOS-HD/NodeData/frackatack/node
        target: /root/.bitcoin
        bind:
          create_host_path: true
x-casaos:
  hostname: ""
  icon: https://raw.githubusercontent.com/WillItMod/5tratStore-dev/refs/heads/main/willitmod-dev-fracattack/icon.png
  index: /
  is_uncontrolled: false
  main: app
  port_map: "21225"
  scheme: http
  title:
    custom: Frackatack
