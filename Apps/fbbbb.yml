name: fracattack-native-zimaos
networks:
  frackatack_net:
    name: compose-custom_frackatack_net
    driver: bridge

services:
  app:
    container_name: Frackatack_app
    image: ghcr.io/willitmod/fracattack-app-umbrel-dev:0.1.4
    restart: unless-stopped
    user: "0:0"
    deploy:
      resources:
        limits:
          memory: 4GB
          cpus: "1.00"
        reservations:
          memory: 256MB
          cpus: "0.00"
    environment:
      APP_CHANNEL: ZIMAOS
      APP_COMPOSE_PROJECT: frackatack
      APP_ID: willitmod-dev-fracattack
      APP_RELEASE_PHASE: ZIMAOS
      APP_VERSION: 0.4.0
      BTC_CKPOOL_IMAGE: ghcr.io/willitmod/docker-ckpool-solo:590fb2a
      BTC_NODE_IMAGE: ghcr.io/willitmod/fracattack-fractald:0.4.0
      BTC_RPC_HOST: Frackatack_node
      BTC_RPC_PASS: poolpassword
      BTC_RPC_PORT: "28342"
      BTC_RPC_USER: fractal
      # Hierdoor kan de WebUI de ckpool stats direct uit de juiste container API trekken:
      CKPOOL_STRATUM_HOST: Frackatack_ckpool
      CKPOOL_STRATUM_PORT: "3333"
      CKPOOL_CONFIG_FILE: /data/pool/config/ckpool.conf
      CKPOOL_STATUS_DIR: /data/pool/www/pool
      JWT_SECRET: sajkdh9a23hf8923hfshdf23
      NETWORK_IP: Frackatack_ckpool
      POOL_CONFIG_DIR: /data
      POOL_LOG_FILE: /data/pool/logs/ckpool.log
      STATIC_DIR: /app/static
    networks:
      - frackatack_net
    ports:
      - target: 3000
        published: 21225
        protocol: tcp
        mode: ingress
    volumes:
      - type: bind
        source: /media/ZimaOS-HD/NodeData/frackatack
        target: /data
        bind:
          create_host_path: true
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: true

  ckpool:
    container_name: Frackatack_ckpool
    image: ghcr.io/willitmod/docker-ckpool-solo:590fb2a
    restart: unless-stopped
    user: "0:0"
    privileged: true
    command:
      - -k
      - -L
      - -c
      - /data/pool/config/ckpool.conf
    deploy:
      resources:
        limits:
          memory: 4GB
          cpus: "1.00"
        reservations:
          memory: 256MB
          cpus: "0.00"
    environment:
      BTC_RPC_HOST: Frackatack_node
      BTC_RPC_PASSWORD: poolpassword
      BTC_RPC_PORT: "28342"
      BTC_RPC_USER: fractal
      BTC_ZMQ_HASHBLOCK_PORT: "28345"
      MAXDIFF: "1048576"
      MINDIFF: "2048"
      PAYOUT_ADDRESS: bc1qp05vuzc5x4ym3cujh666xm6mzh0q6yqmkmtndl
      STARTDIFF: "8192"
    networks:
      - frackatack_net
    ports:
      - target: 3333
        published: 7891
        protocol: tcp
        mode: ingress
    volumes:
      - type: bind
        source: /media/ZimaOS-HD/NodeData/frackatack
        target: /data
        bind:
          create_host_path: true

  node:
    container_name: Frackatack_node
    image: ghcr.io/willitmod/fracattack-fractald:0.4.0
    restart: unless-stopped
    stop_grace_period: 15m30s
    user: "0:0"
    command:
      - bitcoind
      - -conf=/data/node/bitcoin.conf
      - -datadir=/root/.bitcoin
    depends_on:
      init:
        condition: service_completed_successfully
        required: true
    deploy:
      resources:
        limits:
          memory: 8GB
          cpus: "2.00"
        reservations:
          memory: 256MB
          cpus: "0.00"
    networks:
      - frackatack_net
    ports:
      - target: 28342
        published: 28342
        protocol: tcp
        mode: ingress
      - target: 28343
        published: 28343
        protocol: tcp
        mode: ingress
      - target: 28345
        published: 28345
        protocol: tcp
        mode: ingress
    volumes:
      - type: bind
        source: /media/ZimaOS-HD/NodeData/frackatack
        target: /data
        bind:
          create_host_path: true
      - type: bind
        source: /media/ZimaOS-HD/NodeData/frackatack/node
        target: /root/.bitcoin
        bind:
          create_host_path: true

  init:
    container_name: Frackatack_init
    image: alpine:3.22.1
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 4GB
          cpus: "1.00"
        reservations:
          memory: 256MB
          cpus: "0.00"
    networks:
      - frackatack_net
    volumes:
      - type: bind
        source: /media/ZimaOS-HD/NodeData/frackatack
        target: /data
        bind:
          create_host_path: true
    command:
      - /bin/sh
      - -ec
      - >-
        set -eu

        mkdir -p /data/node /data/pool/config /data/pool/www/pool /data/pool/www/users

        # Genereer direct een loepzuivere bitcoin.conf op de ZimaOS schijf
        echo 'server=1' > /data/node/bitcoin.conf

        echo 'listen=1' >> /data/node/bitcoin.conf

        echo 'discover=1' >> /data/node/bitcoin.conf

        echo 'rpcuser=fractal' >> /data/node/bitcoin.conf

        echo 'rpcpassword=poolpassword' >> /data/node/bitcoin.conf

        echo 'rpcport=28342' >> /data/node/bitcoin.conf

        echo 'port=28343' >> /data/node/bitcoin.conf

        echo 'rpcbind=0.0.0.0' >> /data/node/bitcoin.conf

        echo 'rpcallowip=0.0.0.0/0' >> /data/node/bitcoin.conf

        echo 'prune=10000' >> /data/node/bitcoin.conf

        echo 'zmqpubhashblock=tcp://0.0.0.0:28345' >> /data/node/bitcoin.conf

        echo 'txindex=0' >> /data/node/bitcoin.conf

        echo 'addnode=162.218.239.114:8333' >> /data/node/bitcoin.conf

        echo 'addnode=95.217.199.103:8333' >> /data/node/bitcoin.conf


        # Genereer de loepzuivere ckpool.conf met directe container DNS-koppelingen
        echo '{' > /data/pool/config/ckpool.conf

        echo '  "bindaddress": "0.0.0.0",' >> /data/pool/config/ckpool.conf

        echo '  "btcaddress": "bc1qp05vuzc5x4ym3cujh666xm6mzh0q6yqmkmtndl",' >> /data/pool/config/ckpool.conf

        echo '  "btchost": "Frackatack_node",' >> /data/pool/config/ckpool.conf

        echo '  "btcpass": "poolpassword",' >> /data/pool/config/ckpool.conf

        echo '  "btcport": 28342,' >> /data/pool/config/ckpool.conf

        echo '  "btcsig": "/FracAttack/",' >> /data/pool/config/ckpool.conf

        echo '  "btcuser": "fractal",' >> /data/pool/config/ckpool.conf

        echo '  "logdir": "/data/pool/www",' >> /data/pool/config/ckpool.conf

        echo '  "maxdiff": 1048576,' >> /data/pool/config/ckpool.conf

        echo '  "mindiff": 2048,' >> /data/pool/config/ckpool.conf

        echo '  "startdiff": 8192,' >> /data/pool/config/ckpool.conf

        echo '  "stratumport": 3333,' >> /data/pool/config/ckpool.conf

        echo '  "userdir": "/data/pool/www/users",' >> /data/pool/config/ckpool.conf

        echo '  "validated": true,' >> /data/pool/config/ckpool.conf

        echo '  "webdir": "/data/pool/www/pool",' >> /data/pool/config/ckpool.conf

        echo '  "zmqblock": "tcp://Frackatack_node:28345"' >> /data/pool/config/ckpool.conf

        echo '}' >> /data/pool/config/ckpool.conf

        if [ ! -f /data/pool/config/ckpool.args ]; then
          echo "-B" > /data/pool/config/ckpool.args
        fi

x-casaos:
  author: WVK2017
  category: Crypto
  hostname: ""
  icon: https://githubusercontent.com
  index: /
  is_uncontrolled: false
  main: app
  port_map: "21225"
  scheme: http
  store_app_id: compose-custom-fracattack
  title:
    custom: Frackatack Node+Solo Pool (ZimaOS Native)
