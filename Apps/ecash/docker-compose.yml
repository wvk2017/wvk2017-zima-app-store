name: wvk2017-ecash
services:
  app:
    container_name: ecash
    image: wvk2017/nodes:ecash
    restart: always
    volumes:
      - /media/ZimaOS-HD/NodeData/ecash:/root/.bitcoin
    ports:
      - "7007:7007"
      - "9007:9007"
      - "8336:8336"
    command: "/usr/bin/bitcoind -printtoconsole -server -prune=550 -wallet=default -zmqpubhashblock=tcp://127.0.0.1:7007 -rpcbind=0.0.0.0 -rpcport=9007 -rpcallowip=0.0.0.0/0 -port=8336 -rpcuser=pooluser -rpcpassword=poolpassword"
    x-casaos:
      volumes:
        - container: /root/.bitcoin
          description:
            en_us: 'Container Path: /root/.bitcoin'
      ports:
        - container: "7007"
          description:
            en_us: 'Container Port: 7004'
        - container: "9007"
          description:
            en_us: 'Container Port: 9004'
        - container: "8336"
          description:
            en_us: 'Container Port: 8336'
x-casaos:
  architectures:
    - amd64
  main: app
  description:
    en_us: Ecash XEC Cryptocurrency Node. Can be used in conjunction with Miningcore Apps to solo mine.
  tagline:
    en_us: Ecash XEC Cryptocurrency Node.
  developer: wvk2017
  author: wvk2017
  icon: https://miningpoolstats.stream/ico/ecash.webp
  thumbnail: ""
  title:
    en_us: Ecash (XEC) Node
  category: WVK2017
  port_map: "8888"
